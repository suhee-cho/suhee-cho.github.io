ashtag fa-sm"></i> Sci-Fi </a> </li> </ul> </div> <article> <div class="page-paper books-paper"> <div class="books-sort-bar"> <span class="books-sort-label">Sort by</span> <button class="books-sort-btn active" data-sort="az">A-Z</button> <button class="books-sort-btn" data-sort="finished">Finished date</button> <button class="books-sort-btn" data-sort="released">Published date</button> <button class="books-sort-btn" data-sort="rating">Ratings</button> </div> <div id="book-pool" hidden> <figure class="cover filterable" data-tags="Novel Warm Loneliness" data-title="Eleanor Oliphant is completely fine" data-released="2017" data-finished="2025-07-27" data-finished-year="2025" data-released-year="2017" data-overall="5"> <a class="cover-link" href="/books/Eleanor_Oliphant.html"> <img alt="Eleanor Oliphant is completely fine cover" src="http://covers.openlibrary.org/b/olid/OL27963825M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Memoir" data-title="I'm glad my mom died" data-released="2022" data-finished="2026-04-21" data-finished-year="2026" data-released-year="2022" data-overall="4"> <a class="cover-link" href="/books/Im_glad_my_mom_died.html"> <img alt="I'm glad my mom died cover" src="http://covers.openlibrary.org/b/olid/OL46312047M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Novel Sci-Fi" data-title="Klala and the sun" data-released="2021" data-finished="2026-01-20" data-finished-year="2026" data-released-year="2021" data-overall="4"> <a class="cover-link" href="/books/Klara_and_the_sun.html"> <img alt="Klala and the sun cover" src="http://covers.openlibrary.org/b/olid/OL33802423M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Memoir" data-title="Born a crime" data-released="2016" data-finished="2025-04-01" data-finished-year="2025" data-released-year="2016" data-overall="4"> <a class="cover-link" href="/books/born_a_crime.html"> <img alt="Born a crime cover" src="http://covers.openlibrary.org/b/olid/OL27343359M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Memoir Nature" data-title="Why Fish Don't Exist" data-released="2020" data-finished="2025-06-20" data-finished-year="2025" data-released-year="2020" data-overall="5"> <a class="cover-link" href="/books/fish_dont_exist.html"> <img alt="Why Fish Don't Exist cover" src="http://covers.openlibrary.org/b/olid/OL29822227M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Novel Romance Psychology" data-title="Half his age" data-released="2026" data-finished="2026-05-01" data-finished-year="2026" data-released-year="2026" data-overall="3"> <a class="cover-link" href="/books/half_his_age.html"> <img alt="Half his age cover" src="http://covers.openlibrary.org/b/olid/OL61211616M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Memoir Politics" data-title="Hillbilly Elegy" data-released="2017" data-finished="2025-06-29" data-finished-year="2025" data-released-year="2017" data-overall="3"> <a class="cover-link" href="/books/hillbilly_elegy.html"> <img alt="Hillbilly Elegy cover" src="http://covers.openlibrary.org/b/olid/OL27715249M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Philosophy Non-fiction" data-title="Life is hard" data-released="2023" data-finished="2025-06-10" data-finished-year="2025" data-released-year="2023" data-overall="4"> <a class="cover-link" href="/books/life_is_hard.html"> <img alt="Life is hard cover" src="http://covers.openlibrary.org/b/olid/OL38942591M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Memoir Nature" data-title="Raising Hare" data-released="2025" data-finished="2026-03-04" data-finished-year="2026" data-released-year="2025" data-overall="5"> <a class="cover-link" href="/books/raising_hare.html"> <img alt="Raising Hare cover" src="http://covers.openlibrary.org/b/olid/OL51323018M-L.jpg?default=false" style="height:200px"> </a> </figure> <figure class="cover filterable" data-tags="Novel Fiction Adventure Mystic" data-title="The Alchemist" data-released="1988" data-finished="2026-01-06" data-finished-year="2026" data-released-year="1988" data-overall="3"> <a class="cover-link" href="/books/the_alchemist.html"> <img alt="The Alchemist cover" src="http://covers.openlibrary.org/b/olid/OL7288233M-L.jpg?default=false" style="height:200px"> </a> </figure> </div> <div id="books-display"></div> </div> </article> </div> <script>
(function () {
  var activeTag  = null;
  var activeSort = 'az';

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function poolFigures() {
    return Array.from(document.querySelectorAll('#book-pool .filterable, #books-display .filterable'));
  }

  function groupKey(fig) {
    if (activeSort === 'az') return '';
    if (activeSort === 'finished') return fig.dataset.finishedYear || '—';
    if (activeSort === 'released') return String(fig.dataset.releasedYear || '—');
    if (activeSort === 'rating') {
      var r = parseFloat(fig.dataset.overall) || 0;
      return r > 0 ? String(Math.floor(r)) : 'Unrated';
    }
    return '—';
  }

  function sortKey(fig) {
    if (activeSort === 'az')       return (fig.dataset.title || '').toLowerCase();
    if (activeSort === 'finished') return fig.dataset.finished || '';
    if (activeSort === 'released') return String(fig.dataset.released || '');
    if (activeSort === 'rating')   return parseFloat(fig.dataset.overall) || 0;
    return '';
  }

  function headingHTML(key) {
    if (activeSort === 'rating') {
      if (key === 'Unrated') return 'Unrated';
      var n = parseInt(key, 10);
      var html = '';
      for (var i = 1; i <= 5; i++) {
        html += i <= n
          ? '<i class="fa-solid fa-star fa-sm"></i>'
          : '<i class="fa-regular fa-star fa-sm"></i>';
      }
      return html;
    }
    return key;
  }

  function applyTagToFig(fig) {
    if (!activeTag) { fig.hidden = false; return; }
    var tags = (fig.dataset.tags || '').split(/\s+/).filter(Boolean).map(slugify);
    fig.hidden = !tags.includes(activeTag);
  }

  function renderBooks() {
    var display = document.getElementById('books-display');
    var figs = poolFigures();

    figs.sort(function (a, b) {
      var ka = sortKey(a), kb = sortKey(b);
      if (activeSort === 'rating') return kb - ka;
      return ka < kb ? 1 : ka > kb ? -1 : 0;
    });

    var groups = {}, order = [];
    figs.forEach(function (fig) {
      var k = groupKey(fig);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(fig);
    });

    if (activeSort === 'rating') {
      order.sort(function (a, b) {
        if (a === 'Unrated') return 1;
        if (b === 'Unrated') return -1;
        return parseInt(b, 10) - parseInt(a, 10);
      });
    } else {
      order.sort(function (a, b) {
        if (a === '—') return 1;
        if (b === '—') return -1;
        return b.localeCompare(a);
      });
    }

    display.innerHTML = '';
    order.forEach(function (key) {
      var group = document.createElement('div');
      group.className = 'filter-group';

      if (key !== '') {
        var h2 = document.createElement('h2');
        h2.className = 'books-year-heading';
        h2.innerHTML = headingHTML(key);
        group.appendChild(h2);
      }

      var row = document.createElement('div');
      row.className = 'books-row';
      groups[key].forEach(function (fig) {
        applyTagToFig(fig);
        row.appendChild(fig);
      });
      group.appendChild(row);

      var hasVisible = groups[key].some(function (f) { return !f.hidden; });
      group.hidden = !hasVisible;
      display.appendChild(group);
    });
  }

  function applyTagFilter() {
    document.querySelectorAll('#books-display .filterable').forEach(applyTagToFig);
    document.querySelectorAll('#books-display .filter-group').forEach(function (g) {
      var vis = Array.from(g.querySelectorAll('.filterable')).some(function (f) { return !f.hidden; });
      g.hidden = !vis;
    });
  }

  document.addEventListener('click', function (e) {
    var sortBtn = e.target.closest('.books-sort-btn');
    if (sortBtn) {
      e.preventDefault();
      activeSort = sortBtn.dataset.sort;
      document.querySelectorAll('.books-sort-btn').forEach(function (b) {
        b.classList.toggle('active', b === sortBtn);
      });
      renderBooks();
      return;
    }

    var tagBtn = e.target.closest('[data-tag]');
    if (tagBtn) {
      e.preventDefault();
      var tag = slugify(tagBtn.dataset.tag);
      activeTag = (activeTag === tag) ? null : tag;
      document.querySelectorAll('[data-tag]').forEach(function (b) {
        b.classList.toggle('tag-active', slugify(b.dataset.tag) === activeTag);
      });
      applyTagFilter();
    }
  });

  renderBooks();
})();
